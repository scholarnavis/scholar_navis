name: Build Scholar Navis (Windows / Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04：glibc 2.35 基线，产物可覆盖绝大多数现代发行版。
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      # PyInstaller 在分析阶段会探测 Qt 运行库；缺少这些系统库时 Linux 打包会
      # 出现难以定位的 hook 失败。构建产物本身不打包系统库（由用户发行版提供），
      # 运行期缺失时应用会在启动前给出安装指引（见 src/core/platform_env.py）。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxshmfence1 \
            libxtst6 libasound2 libcups2 libdrm2 libgbm1 libfontconfig1

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build Application and Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: uv run build_app.py

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Scholar-Navis-Build-${{ matrix.os }}
          path: |
            *.zip
          retention-days: 7

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: '*.zip'

          generate_release_notes: true
