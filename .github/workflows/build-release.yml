name: Build Scholar Navis (Windows / Linux)

# 产物形态契约（改动前务必先读）
# ---------------------------------------------------------------------------
# * Windows = PyInstaller `--onedir` 冻结包：用户机器上不一定有可用的 Python，
#   所以解释器与依赖一起带上。冻结包与宿主工具链绑定，因此构建环境仍要固定
#   （glibc / MSVC 运行库这类约束只作用于这一条链路）。
# * Linux = **源码包**（不再使用 PyInstaller）：包里只有本项目源码 + uv.lock +
#   启动器 run.sh，依赖由用户机器上的 uv 解析。**产物里没有任何二进制**，所以
#   没有 glibc 地板，也不需要构建容器；用户还能用上自己发行版的 Qt/X11 库
#   （PySide6 的 manylinux wheel 是动态链接的，冻结方案必须把系统库一并复制，
#   产物与构建镜像强绑定，且体积达 GB 级）。
#
# 两条链路共用同一套命名契约（`scholar_navis_{平台}_{通道}_v{版本}.zip`），
# 因此 Cloudflare Worker 与应用内的更新检查都无需区分形态。
# ---------------------------------------------------------------------------
#
# 发布链路（改动前同样先读）
# ---------------------------------------------------------------------------
# tag 推送 → 构建矩阵产出两个 zip（文件名自带发布通道，见 build_app.py）→
# 分别上传到 Cloudflare R2（应用内更新检查读的就是 R2 的这份）→ 汇总到
# publish-release 任务创建 GitHub Release（正文 = 版本/通道/下载地址/更新日志，
# 附件 = 两个 zip）。
#
# 通道（stable / dev）只由版本号里是否含 `-dev` 决定，判定实现只有一处：
# `src/core/version.py::release_channel`。本文件**不**重复写一遍判定逻辑，
# 而是让 `build_support/release_notes.py` 把结果经 $GITHUB_OUTPUT 回传
# （prerelease / make_latest 都用它），避免产物名与 Release 标记漂移。
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 把 R2 端点的 DNS 解析限制到 IPv4。R2 的 *.r2.cloudflarestorage.com 同时发布
  # A 与 AAAA 记录，而 GitHub 的 Windows runner 没有 IPv6 出口；Python 的 socket
  # 不做 Happy Eyeballs，会先在不可达的 IPv6 上等到超时，报错只剩
  # "Could not connect to the endpoint URL"，与 DNS/凭证问题无法区分。
  R2_FORCE_IPV4: "1"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 构建任务不再需要写权限：Release 由下面的 publish-release 统一创建。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 只是源码打包的宿主：产物里没有二进制，runner 的 glibc
        # 不再进入产物，因此不需要为了基线而固定发行版。
        os: [windows-latest, ubuntu-24.04]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 提前拦截"tag 与源码版本号不一致"：产物名里的版本/通道取自
      # src/core/version.py，若与 tag 不同步，R2 上就会多出一个谁也查不到的
      # 对象（或落到错误的通道里），而 20 分钟的构建白跑。
      - name: Verify tag matches src/core/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          SRC_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/core/version.py)
          if [ -z "$SRC_VERSION" ]; then
            echo "::error::could not read __version__ from src/core/version.py"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION src/core/version.py=$SRC_VERSION"
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match src/core/version.py (${SRC_VERSION}); bump the version (or re-tag) before releasing."
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      # ------------------------------------------------------------------ #
      # Windows：PyInstaller 冻结包（需要完整的锁定环境）
      # ------------------------------------------------------------------ #
      # pyinstaller / boto3 / python-dotenv 都在 dev 依赖组里，`uv sync` 默认就会
      # 安装，因此不需要再补 `uv pip install pyinstaller`。--locked 保证用的就是
      # 仓库里的 uv.lock：lockfile 过期时让 CI 直接失败，而不是悄悄重新解析。
      - name: Build Application and Upload to R2 (Windows)
        if: runner.os == 'Windows'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          uv sync --locked
          uv run --locked build_app.py

      # ------------------------------------------------------------------ #
      # Linux：源码包（打包 + 上传 R2）
      # ------------------------------------------------------------------ #
      # 打包本身只用到 boto3 + python-dotenv（R2 上传），不需要项目运行期依赖：
      # torch / PySide6 / onnxruntime 合计数 GB，为一个 zip 先装一遍整个运行环境
      # 是纯浪费。因此用 --no-project 的临时环境构建（源码模式下的许可声明不
      # 收集 wheel 正文，见 build_support/notices.py 的 mode 说明）。
      - name: Build source bundle and Upload to R2 (Linux)
        if: runner.os == 'Linux'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 \
            --with boto3 --with python-dotenv \
            build_app.py

      # 断言源码包"可解压、可运行、不缺件"：产物里没有二进制，出了问题的表现是
      # 用户在 `uv sync` 或启动时才看到缺文件，因此把检查前移到 CI。
      # 同时拒绝把 __pycache__ / .venv 之类的本地状态带进产物。
      - name: Verify source bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import zipfile

          # 命名契约：scholar_navis_linux_{stable|dev}_v{版本}.zip
          name_re = re.compile(r"^scholar_navis_linux_(stable|dev)_v.+\.zip$")
          archives = [f for f in os.listdir(".") if f.endswith(".zip")]
          if len(archives) != 1 or not name_re.match(archives[0]):
              print(f"::error::expected exactly one artifact matching the naming "
                    f"contract, found {archives}")
              sys.exit(1)

          archive = archives[0]
          root = "scholar_navis/"
          required = [
              root + "run.sh",
              root + "main.py",
              root + "pyproject.toml",
              root + "uv.lock",
              root + "LICENSE",
              root + "THIRD_PARTY_NOTICES.md",
              root + "Assets/js/mermaid.min.js",   # 运行期必需的静态资源
              root + "src/core/version.py",
          ]

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              bad = [n for n in names
                     if "__pycache__" in n or n.endswith((".pyc", ".pyo"))
                     or "/.venv/" in n or n.startswith(root + "models/")]
              missing = [p for p in required if p not in names]
              mode = (zf.getinfo(root + "run.sh").external_attr >> 16) & 0o777
              print(f"artifact : {archive} ({os.path.getsize(archive) / 1024 / 1024:.2f} MB)")
              print(f"entries  : {len(names)}")
              print(f"top-level: {sorted({n.split('/')[0] for n in names})}")

              if bad:
                  print(f"::error::local state leaked into the bundle: {bad[:10]}")
                  sys.exit(1)
              if missing:
                  print(f"::error::the bundle is missing required entries: {missing}")
                  sys.exit(1)
              if mode & 0o111 == 0:
                  print(f"::error::run.sh is not executable inside the archive (mode "
                        f"{oct(mode)}); unzip would not restore the bit.")
                  sys.exit(1)

              # 语法体检：解压源码并整体字节码编译，避免把 SyntaxError 交给用户。
              with tempfile.TemporaryDirectory() as tmp:
                  zf.extractall(tmp)
                  package_dir = os.path.join(tmp, "scholar_navis")

                  result = subprocess.run(
                      [sys.executable, "-m", "compileall", "-q", package_dir],
                      capture_output=True, text=True)
                  if result.returncode != 0 or result.stdout.strip():
                      print("::error::byte-compilation of the bundled sources failed")
                      print(result.stdout or result.stderr)
                      sys.exit(1)

                  # 用户对源码包的第一条命令就是 run.sh 里的 `uv sync --locked`，因此
                  # 包内 pyproject.toml 与 uv.lock 必须是自洽的一对（uv 会把根项目版本号
                  # 写进 lockfile，版本不同步就会硬失败）。build_app.py 已在打包时刷新，
                  # 这里独立复核一遍，避免回归。
                  lock = subprocess.run(["uv", "lock", "--check", "--offline"],
                                        cwd=package_dir, capture_output=True, text=True)
                  if lock.returncode != 0:
                      print("::error::the bundled pyproject.toml / uv.lock pair is not "
                            "self-consistent; `uv sync --locked` would fail for users")
                      print(lock.stdout or lock.stderr)
                      sys.exit(1)

          print("OK: source bundle is complete, clean and byte-compiles.")
          PY

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Scholar-Navis-Build-${{ matrix.os }}
          path: |
            *.zip
          # 产物名不匹配即视为构建失败：publish-release 会按命名契约校验，
          # 这里先拦一层，避免"零文件也照样绿灯"。
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 生成更新日志要遍历 tag 历史，浅克隆拿不到 `git describe`。
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Scholar-Navis-Build-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      # 正文里的版本/通道/下载地址/更新日志全部由脚本生成（通道判定复用
      # src/core/version.py）。脚本同时校验产物命名与 tag 一致，并把
      # prerelease / make_latest 经 $GITHUB_OUTPUT 回传。
      #
      # LLM 双语摘要为**可选**：三项配置（Secrets: LLM_API_KEY；Variables 或
      # Secrets: LLM_BASE_URL / LLM_MODEL）任一缺失，或接口报错/超时/输出结构
      # 不合规，脚本都会自动退化为"只列原始提交"，绝不因此让发版失败。
      # 只依赖标准库（urllib），因此这里不需要 uv sync。
      - name: Compose release notes
        id: notes
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          python3 build_support/release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir release-assets \
            --out release-body.md
          echo "::group::release-body.md"
          cat release-body.md
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Scholar Navis ${{ github.ref_name }}
          body_path: release-body.md
          # GitHub 自带的 PR/贡献者列表追加在正文之后。
          generate_release_notes: true
          draft: false
          # dev 版本标记为 pre-release，并且不抢占 "Latest release"。
          prerelease: ${{ steps.notes.outputs.prerelease }}
          make_latest: ${{ steps.notes.outputs.make_latest }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
