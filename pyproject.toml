[project]
name = "scholar-navis"
version = "2.1.0-dev-2"
description = "Scholar Navis"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "markdown>=3.10.2",
    "pymupdf>=1.26.7",
    "pyqtdarktheme>=2.1.0",
    "pyside6>=6.10.2",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.590.48",
    "pymupdf4llm>=0.2.9",
    "langdetect>=1.0.9",
    "mcp[cli]>=1.28.1,<2",
    "biopython>=1.87",
    "curl-cffi>=0.15.0",
    "cryptography>=50.0.0",
    "keyring>=24.0.0",
    "chardet<6.0",
    "python-docx>=1.2.0",
    "email-validator>=2.3.0",
    "disposable-email-domains>=0.0.167",
    "beautifulsoup4>=4.14.3",
    "litellm>=1.84.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "aiohttp>=3.14.3",
    "requests>=2.33.0",
    "pygments>=2.20.0",
    "lxml>=6.1.0",
    "python-multipart>=0.0.31",
    "langsmith>=0.8.18",
    "urllib3>=2.8.0",
    "starlette>=1.3.1",
    "idna>=3.15",
    "pyjwt>=2.15.0",
    "tiktoken>=0.12.0",
    "httpx[socks]>=0.28.1",
]


[dependency-groups]
dev = [
    "boto3>=1.42.62",
    "pyinstaller>=6.19.0",
    "tuna>=0.5.11",
]


[tool.uv]
# 依赖锁定用到两项较新的能力：exclude-dependencies 的作用域形式，以及 lock
# revision 5。两者都需要 uv >= 0.13，这里显式声明最低版本——旧版 uv 会直接拒绝
# 运行整个项目并给出可读提示，而不是抛出难懂的 TOML / lockfile 解析错误。
required-version = ">=0.13.0"



# ---- 安全下限（Dependabot 告警修复）----
# 这些是传递依赖，没法在 [project.dependencies] 里写下限。用 constraint-dependencies
# 集中声明全局最低版本，防止解析器把它们降回受影响区间而重新引入同一告警。
# 每项注明对应公告；上游再发修复版时同步抬高。
constraint-dependencies = [
    "anyio>=4.14.2",        # GHSA-82r6-8w77-94w6(Critical) / GHSA-5p39-cfhj-2xmp
    "click>=8.3.3",         # PYSEC-2026-2132
    "setuptools>=83.0.0",   # GHSA-h35f-9h28-mq5c
    "soupsieve>=2.9.0",     # GHSA-2wc2-fm75-p42x / -836r-79rf-4m37 / -gjv8-xp57-g29c / -j934-xhv5-fg8f
    "fsspec>=2026.6.0",     # GHSA-27vj-qcqg-25rc(High)
    "multidict>=6.9.1",     # GHSA-54p9-h82j-f925；aiohttp 钉 <7.0，故下限即 6.9.1
    "oauthlib>=4.0.0",      # GHSA-xpv3-w29h-x7cv / GHSA-hj66-6f7g-4r5v
]

# ---- 安全说明 ----
# 本地推理栈（chromadb / onnxruntime / onnx / tokenizers / transformers）已整体移除：
# 随它们带入的 9 条告警（2 Critical + 6 High + 1 Moderate，其中 4 条来自 chromadb、
# 5 条来自 transformers）不再适用于本项目。`uv.lock` 与 `requirements.txt` 表达同一份
# 解析结果，Dependabot 按 manifest 分别记录计数。
# 若日后重新引入向量检索或本地推理，需重新复核这些告警的上界与 first_patched_version
# （2026-10 复核时 chromadb 的 vulnerable 上界为 `<= 1.5.9` 且无修复版本）。



